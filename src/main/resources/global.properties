env=qa

# Demo app (we?ll use it in Level 6+ for login)
app.url.dev=https://www.saucedemo.com
app.url.qa=https://oim.pre.mapfre.com.pe/#/login
app.url.prod=https://www.saucedemo.com
#report.screenshots.dir=target/screenshots

# Global UI synchronization
ui.spinner.xpath=//div[contains(@class,'spinner')]
ui.spinner.quietMs=250
ui.spinner.timeoutMs=120000

ui.screenshot.checkpoints.enabled=true

# Escala de las esperas fijas heredadas (BasePage.waitRandomBetween). 1.0 = espera completa; 0.5 = mitad
ui.legacyWait.scale=1.0

# Tiempo maximo para que aparezca una nueva pestaña/popup (PopupHandler.abrir)
ui.popup.timeoutMs=30000

# Sitio demo publico (ejemplo de referencia de nueva pestaña, tag @nuevapestana)
demo.url.letskodeit=https://www.letskodeit.com/practice

# Pool de numeros de documento reales (escenarios de reemplazo). El archivo NO se versiona:
#   local: testdata.documentos.pool.path=config/local/documentos_pool.txt en config/local/global.properties
#   Jenkins: variable de entorno TESTDATA_DOCUMENTOS_POOL_PATH (credencial "Secret file")
# stride = slots reservados por ejecucion (ver ConsumidorDocumento). Cambiarlo solo al regenerar el pool.
# reservaLocal = ultimos N valores del pool reservados para ejecuciones locales.
# Primera linea del archivo: #runIdBase=<BUILD_NUMBER al generarlo>. En Jenkins runId = BUILD_NUMBER - runIdBase.
# Opcional: -Ddata.runId=N fuerza el runId tal cual (por defecto lo anterior en Jenkins, contador local fuera de Jenkins).
# Los valores duplicados del archivo se descartan al cargar.
testdata.documentos.pool.path=
testdata.documentos.stride=20
testdata.documentos.reservaLocal=1000

# Credenciales: NO versionar aqui. Definir user.email / user.password por una de estas vias
# (en orden de prioridad):
#   1) -Duser.email=... -Duser.password=...
#   2) variables de entorno USER_EMAIL / USER_PASSWORD
#   3) archivo local config/local/global.properties (ignorado por git)