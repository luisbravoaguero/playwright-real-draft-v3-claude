browser=chromium
headless=true
maximize=true
pageLoadTimeout=40000
# true (por defecto) = Playwright + navegador nuevos por escenario (comportamiento original)
# false = un navegador por hilo reutilizado, con contexto nuevo por escenario (opcional, para probar)
browser.perScenario=true
# Trace de Playwright por escenario (red + DOM + capturas; abrir en https://trace.playwright.dev)
# off | on | retain-on-failure (solo se guarda el zip si el escenario falla)
trace.mode=retain-on-failure
trace.dir=target/traces
# Mitigaciones de headless (opcionales, vacias/false = comportamiento original):
#   browser.channel=chromium -> headless nuevo (navegador completo) en vez de chromium-headless-shell; chrome = Google Chrome
#   browser.ua.hideHeadless=true -> user agent de Chrome normal (sin "HeadlessChrome") en Chromium headless
#   browser.userAgent=... -> user agent explicito (tiene prioridad)
#   browser.locale=es-PE / browser.timezoneId=America/Lima
browser.channel=
browser.ua.hideHeadless=false
browser.userAgent=
browser.locale=
browser.timezoneId=
#defaultTimeoutMs=40000
#se implementara un mentodo para la siguiente version
implicitWait=10